# Host-installed Nginx reverse proxy for Google Cloud public-IP deployments.
# Do not run Nginx in Docker for this project.
# Install/copy this file on the VM, for example:
#   sudo cp nginx/default.conf /etc/nginx/conf.d/tile-game.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# No domain is required: this server block answers any Host header on port 80.
# Docker Compose publishes web/api only on localhost for this host Nginx to reach.

upstream tile_game_web {
    server 127.0.0.1:3000;
}

upstream tile_game_api {
    server 127.0.0.1:3001;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Nginx/container health check.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # NestJS API. The backend already uses the /api global prefix, so keep it.
    location /api/ {
        proxy_pass http://tile_game_api;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Next.js static assets.
    location /_next/static/ {
        proxy_pass http://tile_game_web;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Next.js app.
    location / {
        proxy_pass http://tile_game_web;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}
