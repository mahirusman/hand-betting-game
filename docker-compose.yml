services:
  api:
    image: tile-game-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    env_file:
      - .env
  web:
    image: tile-game-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ''
    depends_on:
      - api
